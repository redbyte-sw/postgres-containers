# Downstream (redByte-sw) build of the PostgreSQL images with linux/ppc64le support.
#
# Upstream's bake workflows push to ghcr.io/${{ github.repository_owner }}, which is not
# a valid image reference for the redByte-sw owner (uppercase), and only copy images to
# production names from main. This workflow builds a reduced set straight to production names.
#
# Trigger: push to the ppc64le branch, or run manually.
# Result:  ghcr.io/<owner>/postgresql:18-minimal-trixie, :18.6-minimal-trixie, ...
name: ppc64le-release
on:
  push:
    branches:
      - ppc64le
  workflow_dispatch:

permissions: read-all

env:
  # docker-bake.hcl target names: postgresql-<major>-<minimal|standard|system>-<distro>
  TARGETS: postgresql-18-minimal-trixie postgresql-18-standard-trixie

jobs:
  images:
    name: Build and push PostgreSQL images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: linux/arm64,linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          # image names must be lowercase (owner is redByte-sw)
          environment=production registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,} revision=${GITHUB_SHA} \
            docker buildx bake --push --metadata-file bake-metadata.json ${TARGETS}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images
        run: |
          images=$(jq -r '.[] | (."image.name" | sub(",.*";"")) + "@" + ."containerimage.digest"' bake-metadata.json)
          cosign sign --yes ${images}
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          jq -r '.[] | ."image.name" | split(",")[] | "- `" + . + "`"' bake-metadata.json >> $GITHUB_STEP_SUMMARY
